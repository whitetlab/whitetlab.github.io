<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>포트 가족 등록</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #ffffff;
      color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        "Noto Sans KR", sans-serif;
    }

    main {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 4px solid #111111;
      border-radius: 22px;
      font-size: 48px;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 32px;
      line-height: 1.35;
    }

    #message {
      margin: 0;
      font-size: 21px;
      font-weight: 700;
      line-height: 1.6;
    }

    .notice {
      margin-top: 20px;
      font-size: 17px;
      line-height: 1.6;
      color: #555555;
    }
  </style>
</head>

<body>
  <main>
    <div class="logo">P</div>
    <h1>포트 가족 등록</h1>

    <p id="message">
      링크를 확인하고 있습니다.
    </p>

    <p class="notice">
      현재는 가족 등록 링크 연결을 확인하는 테스트 페이지입니다.
    </p>
  </main>

  <script>
    const fragment = window.location.hash;
    const isValidTestLink =
      fragment.startsWith("#v1.") && fragment.length > 4;

    const message = document.getElementById("message");

    if (isValidTestLink) {
      message.textContent =
        "가족 등록 링크가 정상적으로 전달되었습니다.";
    } else {
      message.textContent =
        "가족 등록 정보가 없는 링크입니다.";
    }
  </script>
</body>
</html>

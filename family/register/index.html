<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>포트 가족 등록</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f5f5;color:#111}main{max-width:520px;margin:auto;padding:32px 20px}section{background:white;padding:24px;border-radius:16px}label{display:block;font-weight:700;margin-top:20px}input{box-sizing:border-box;width:100%;padding:14px;margin-top:8px;font-size:18px;border:1px solid #999;border-radius:8px}button,a.button{display:block;box-sizing:border-box;width:100%;padding:15px;margin-top:16px;border:0;border-radius:8px;background:#111;color:white;text-align:center;font-size:18px;font-weight:800;text-decoration:none}.notice{padding:16px;margin:24px 0;background:#eee;line-height:1.6}.error{color:#b00020}#fallback,#ready{display:none}</style></head>
<body><main><section><h1>포트 가족 등록</h1><p>포트 사용자가 도움을 요청할 수 있도록<br>가족 정보를 입력해주세요.</p>
<form id="form" novalidate><label for="name">내 이름</label><input id="name" maxlength="30" placeholder="예: 아들 김백철" autocomplete="name" required>
<label for="phone">내 휴대폰 번호</label><input id="phone" inputmode="tel" maxlength="18" placeholder="010-1234-5678" autocomplete="tel" required>
<div class="notice">포트는 송금, 인증번호, 비밀번호를 요구하지 않습니다.<br>등록된 번호는 도움 요청을 보낼 때만 사용합니다.</div>
<p id="error" class="error" role="alert"></p><button type="submit">등록 정보 보내기</button></form>
<div id="ready"><h2>등록 정보가 준비됐어요.</h2><p>아직 등록 완료가 아닙니다.<br>포트 사용자에게 보낸 링크를<br>포트가 설치된 휴대폰에서 눌러야 완료됩니다.</p></div>
<div id="fallback"><a id="sms" class="button">문자로 보내기</a><button id="copy" type="button">링크 복사</button></div></section></main>
<script>(()=>{'use strict';const allowed=/^[A-Za-z0-9_-]+$/;let invitation=null,completion='',shareText='';const error=document.querySelector('#error');
function decode(){const f=location.hash;if(!f.startsWith('#v1.i.')||f.length>2048)return null;const raw=f.slice(6);if(!raw||!allowed.test(raw))return null;try{const padded=raw.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-raw.length%4)%4);const value=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(padded),c=>c.charCodeAt(0))));if(!value||Object.keys(value).sort().join(',')!=='expiresAt,id,token'||typeof value.id!=='string'||typeof value.token!=='string'||!Number.isSafeInteger(value.expiresAt)||value.id.length<20||value.id.length>128||value.token.length<40||value.token.length>256||!allowed.test(value.id)||!allowed.test(value.token)||value.expiresAt<=Date.now())return null;return value}catch(_){return null}}
function encode(value){const bytes=new TextEncoder().encode(JSON.stringify(value));let binary='';bytes.forEach(b=>binary+=String.fromCharCode(b));return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
invitation=decode();if(!invitation){error.textContent='가족 등록 링크를 확인할 수 없어요.';document.querySelector('button[type=submit]').disabled=true}
document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();error.textContent='';const name=document.querySelector('#name').value.trim(),phone=document.querySelector('#phone').value.replace(/\D/g,'');if(!name||name.length>30||/[\u0000-\u001f\u007f]/.test(name)){error.textContent='이름을 1~30자로 입력해주세요.';return}if(phone.length!==10&&phone.length!==11){error.textContent='휴대폰 번호를 확인해주세요.';return}if(!invitation||invitation.expiresAt<=Date.now()){error.textContent='등록 기간이 지났어요. 포트에서 새 링크를 보내주세요.';return}completion='https://whitetlab.github.io/family/complete#v1.c.'+encode({id:invitation.id,token:invitation.token,expiresAt:invitation.expiresAt,name,phone});shareText='포트 가족 등록 정보입니다.\n\n아래 링크를 포트가 설치된 휴대폰에서 눌러\n가족 등록을 완료해주세요.\n\n'+completion;document.querySelector('#ready').style.display='block';if(navigator.share){try{await navigator.share({text:shareText});return}catch(x){if(x.name==='AbortError')return}}document.querySelector('#fallback').style.display='block';document.querySelector('#sms').href='sms:?&body='+encodeURIComponent(shareText)});
document.querySelector('#copy').addEventListener('click',async()=>{await navigator.clipboard.writeText(completion);document.querySelector('#copy').textContent='복사했어요'});})();</script></body></html>

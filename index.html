<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>포트</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #ffffff;
      color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        "Noto Sans KR", sans-serif;
    }

    main {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .logo {
      width: 88px;
      height: 88px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 4px solid #111111;
      border-radius: 24px;
      font-size: 54px;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 36px;
    }

    p {
      margin: 0;
      font-size: 21px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main>
    <div class="logo">P</div>
    <h1>포트</h1>
    <p>GitHub Pages 테스트가 정상적으로 작동하고 있습니다.</p>
  </main>
</body>
</html>
